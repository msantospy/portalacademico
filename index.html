<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="logo-videira" href="logo-videira.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
  </style>

  <title>portalacademico</title>
  <link rel="stylesheet" href="estilo.css">
</head>

<body>

  <div class="login-aluno"><!--Div principal do login-->
    <section class="titulo-login"><!--Titulo do login-->
      <h1>login portal academico</h1>
    </section>
    
    <form id="form" class="cadastro">

      <div id="email" class="cadastro-login">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Insira seu email" /><!-- Campo para Nome de usuário-->
        <p>Mensagem de erro</p>
      </div>

      <div id="senha" class="cadastro-login">
        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Insira sua senha" /><!-- Campo para Senha-->
        <p>Mensagem de erro</p>
      </div>

      <button type="submit">Entrar</button>
      
    </form>
  </div>
</body>

</html>
